<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB Cookie Checker — Xác thực</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07071a;
      --accent: #6c63ff;
      --accent2: #f093fb;
      --text: #e8e8f0;
      --muted: #7b7b9a;
      --danger: #ff4d6d;
      --success: #22d3a5;
      --input-bg: rgba(255,255,255,0.06);
      --input-border: rgba(255,255,255,0.12);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(108,99,255,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(240,147,251,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(34,211,165,0.06) 0%, transparent 70%);
      pointer-events: none;
      animation: bgPulse 8s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      0% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; border-radius: 50%; animation: float linear infinite; opacity: 0.15; }
    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.1; }
      100% { transform: translateY(-20px) rotate(720deg); opacity: 0; }
    }
    .card {
      -webkit-app-region: no-drag;
      position: relative;
      width: 400px;
      padding: 44px 40px 36px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(108,99,255,0.1), inset 0 1px 0 rgba(255,255,255,0.08);
      animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .lock-wrap { display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .lock-icon {
      width: 68px; height: 68px;
      background: linear-gradient(135deg, rgba(108,99,255,0.3), rgba(240,147,251,0.2));
      border: 1px solid rgba(108,99,255,0.4);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      box-shadow: 0 8px 32px rgba(108,99,255,0.25);
      animation: lockPulse 3s ease-in-out infinite;
    }
    @keyframes lockPulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(108,99,255,0.25); }
      50% { box-shadow: 0 8px 48px rgba(108,99,255,0.45), 0 0 0 8px rgba(108,99,255,0.08); }
    }
    .title {
      text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 6px;
      background: linear-gradient(135deg, #fff 40%, #a5a0ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 32px; line-height: 1.5; }
    .input-group { position: relative; margin-bottom: 16px; }
    .input-group label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%; padding: 13px 44px 13px 16px;
      background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px;
      color: var(--text); font-size: 15px; font-family: 'Inter', sans-serif;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; letter-spacing: 2px;
    }
    .input-wrap input::placeholder { letter-spacing: 0; color: rgba(255,255,255,0.2); font-size: 13px; }
    .input-wrap input:focus {
      border-color: rgba(108,99,255,0.6); background: rgba(108,99,255,0.08);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }
    .eye-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 16px; padding: 4px; display: flex; align-items: center; transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--text); }
    .btn-login {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6); border: none; border-radius: 12px;
      color: #fff; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;
      cursor: pointer; margin-top: 8px;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 20px rgba(108,99,255,0.4);
      position: relative; overflow: hidden;
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(108,99,255,0.55); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .msg { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; text-align: center; display: none; animation: msgIn 0.2s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .msg.error { display: block; background: rgba(255,77,109,0.12); border: 1px solid rgba(255,77,109,0.25); color: #ff8fa3; }
    .msg.success { display: block; background: rgba(34,211,165,0.1); border: 1px solid rgba(34,211,165,0.25); color: var(--success); }
    .msg.shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); } 40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); } 80% { transform: translateX(4px); }
    }
    .footer-links { margin-top: 20px; text-align: center; }
    .change-pwd-btn {
      background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer;
      font-family: 'Inter', sans-serif; text-decoration: underline; text-underline-offset: 3px; transition: color 0.2s;
    }
    .change-pwd-btn:hover { color: var(--accent2); }
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.2s ease;
    }
    .overlay.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      width: 380px; background: rgba(15,15,35,0.97);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
      padding: 32px 28px 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
      animation: cardIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .modal-desc { font-size: 12px; color: var(--muted); margin-bottom: 22px; line-height: 1.6; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn-cancel {
      flex: 1; padding: 11px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: var(--muted); font-size: 13px; font-weight: 500;
      font-family: 'Inter', sans-serif; cursor: pointer; transition: background 0.2s, color 0.2s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .btn-confirm {
      flex: 1; padding: 11px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6); border: none; border-radius: 10px;
      color: #fff; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
      cursor: pointer; transition: opacity 0.2s; box-shadow: 0 4px 16px rgba(108,99,255,0.35);
    }
    .btn-confirm:hover { opacity: 0.9; }
    .step-indicator { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: background 0.3s; }
    .step-dot.active { background: var(--accent); }
    .step-dot.done { background: var(--success); }
    .step-line { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .ver-tag { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.2); white-space: nowrap; }
  </style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="card">
  <div class="lock-wrap">
    <div class="lock-icon">&#x1F510;</div>
  </div>
  <div class="title">FB Cookie Checker</div>
  <div class="subtitle">Nhap mat khau de tiep tuc su dung cong cu</div>

  <div class="input-group">
    <label>Mat khau</label>
    <div class="input-wrap">
      <input type="password" id="pwd" placeholder="Nhap mat khau..." autocomplete="off" spellcheck="false" />
      <button class="eye-btn" id="eyeBtn" tabindex="-1">&#x1F441;</button>
    </div>
  </div>

  <button class="btn-login" id="loginBtn">&#x1F513; Xac nhan &amp; Mo App</button>
  <div class="msg" id="msg"></div>

  <div class="footer-links">
    <button class="change-pwd-btn" id="changePwdBtn">&#x1F511; Doi mat khau app</button>
  </div>
  <div class="ver-tag">FB Cookie Checker v2.0 — Protected</div>
</div>

<!-- Change Password Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">&#x1F511; Doi mat khau</div>
    <div class="modal-desc" id="modalDesc">Nhap master password de xac thuc quyen doi mat khau</div>
    <div class="step-indicator">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-line"></div>
      <div class="step-dot" id="dot3"></div>
    </div>
    <div id="step1">
      <div class="input-group">
        <label>Master Password</label>
        <div class="input-wrap">
          <input type="password" id="masterPwd" placeholder="Nhap master password..." autocomplete="off" />
          <button class="eye-btn" id="eyeMaster" tabindex="-1">&#x1F441;</button>
        </div>
      </div>
    </div>
    <div id="step2" style="display:none">
      <div class="input-group">
        <label>Mat khau moi</label>
        <div class="input-wrap">
          <input type="password" id="newPwd" placeholder="Nhap mat khau moi..." autocomplete="off" />
          <button class="eye-btn" id="eyeNew" tabindex="-1">&#x1F441;</button>
        </div>
      </div>
      <div class="input-group" style="margin-bottom:0">
        <label>Xac nhan mat khau</label>
        <div class="input-wrap">
          <input type="password" id="confirmPwd" placeholder="Nhap lai mat khau..." autocomplete="off" />
          <button class="eye-btn" id="eyeConfirm" tabindex="-1">&#x1F441;</button>
        </div>
      </div>
    </div>
    <div id="step3" style="display:none; text-align:center; padding:12px 0;">
      <div style="font-size:40px;margin-bottom:12px;">&#x2705;</div>
      <div style="font-size:15px;font-weight:600;color:#22d3a5;">Doi mat khau thanh cong!</div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px;">Mat khau moi da duoc luu.</div>
    </div>
    <div class="msg" id="modalMsg"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">Huy</button>
      <button class="btn-confirm" id="confirmBtn">Tiep theo</button>
    </div>
  </div>
</div>

<script>
  // Particles
  const container = document.getElementById('particles')
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div')
    p.className = 'particle'
    const size = Math.random() * 4 + 2
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;background:hsl(${Math.random()*60+240},70%,65%);animation-duration:${Math.random()*12+10}s;animation-delay:${Math.random()*8}s;`
    container.appendChild(p)
  }

  // Eye toggles
  function setupEye(btnId, inputId) {
    const btn = document.getElementById(btnId)
    const inp = document.getElementById(inputId)
    btn.addEventListener('click', () => {
      inp.type = inp.type === 'password' ? 'text' : 'password'
      btn.textContent = inp.type === 'password' ? '\u{1F441}' : '\u{1F648}'
    })
  }
  setupEye('eyeBtn','pwd')
  setupEye('eyeMaster','masterPwd')
  setupEye('eyeNew','newPwd')
  setupEye('eyeConfirm','confirmPwd')

  function showMsg(id, text, type) {
    const el = document.getElementById(id)
    el.className = 'msg ' + type
    el.textContent = text
    if (type === 'error') { void el.offsetWidth; el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),500) }
  }
  function hideMsg(id) { const el = document.getElementById(id); el.className = 'msg'; el.textContent = '' }

  // Login
  const loginBtn = document.getElementById('loginBtn')
  const pwdInput = document.getElementById('pwd')

  async function doLogin() {
    const pwd = pwdInput.value.trim()
    if (!pwd) { showMsg('msg','Vui long nhap mat khau!','error'); return }
    loginBtn.disabled = true
    loginBtn.textContent = 'Dang xac thuc...'
    const ok = await window.authBridge.verify(pwd)
    if (ok) {
      showMsg('msg','Xac thuc thanh cong! Dang mo...','success')
      setTimeout(() => window.authBridge.unlock(), 600)
    } else {
      loginBtn.disabled = false
      loginBtn.textContent = 'Xac nhan & Mo App'
      showMsg('msg','Mat khau khong dung! Thu lai.','error')
      pwdInput.value = ''
      pwdInput.focus()
    }
  }
  loginBtn.addEventListener('click', doLogin)
  pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin() })

  // Change Password Modal
  let currentStep = 1
  const overlay = document.getElementById('overlay')
  const step1El = document.getElementById('step1')
  const step2El = document.getElementById('step2')
  const step3El = document.getElementById('step3')
  const dot1 = document.getElementById('dot1')
  const dot2 = document.getElementById('dot2')
  const dot3 = document.getElementById('dot3')
  const confirmBtn = document.getElementById('confirmBtn')
  const cancelBtn = document.getElementById('cancelBtn')

  document.getElementById('changePwdBtn').addEventListener('click', () => {
    currentStep = 1
    step1El.style.display = ''
    step2El.style.display = 'none'
    step3El.style.display = 'none'
    document.getElementById('masterPwd').value = ''
    document.getElementById('newPwd').value = ''
    document.getElementById('confirmPwd').value = ''
    document.getElementById('modalTitle').textContent = 'Doi mat khau'
    document.getElementById('modalDesc').textContent = 'Nhap master password de xac thuc quyen doi mat khau'
    confirmBtn.textContent = 'Tiep theo'
    confirmBtn.style.display = ''
    cancelBtn.textContent = 'Huy'
    dot1.className = 'step-dot active'
    dot2.className = 'step-dot'
    dot3.className = 'step-dot'
    hideMsg('modalMsg')
    overlay.classList.add('show')
    setTimeout(() => document.getElementById('masterPwd').focus(), 100)
  })

  cancelBtn.addEventListener('click', () => overlay.classList.remove('show'))
  overlay.addEventListener('click', e => { if (e.target === overlay && currentStep !== 3) overlay.classList.remove('show') })

  confirmBtn.addEventListener('click', async () => {
    if (currentStep === 1) {
      const master = document.getElementById('masterPwd').value.trim()
      if (!master) { showMsg('modalMsg','Nhap master password!','error'); return }
      confirmBtn.disabled = true
      confirmBtn.textContent = 'Xac thuc...'
      const ok = await window.authBridge.verifyMaster(master)
      confirmBtn.disabled = false
      if (!ok) {
        confirmBtn.textContent = 'Tiep theo'
        showMsg('modalMsg','Master password khong dung!','error')
        document.getElementById('masterPwd').value = ''
        return
      }
      currentStep = 2
      hideMsg('modalMsg')
      step1El.style.display = 'none'
      step2El.style.display = ''
      document.getElementById('modalTitle').textContent = 'Nhap mat khau moi'
      document.getElementById('modalDesc').textContent = 'Dat mat khau moi cho app (toi thieu 4 ky tu)'
      confirmBtn.textContent = 'Luu mat khau'
      dot1.className = 'step-dot done'
      dot2.className = 'step-dot active'
      setTimeout(() => document.getElementById('newPwd').focus(), 100)
    } else if (currentStep === 2) {
      const newPwd = document.getElementById('newPwd').value
      const confirmPwd = document.getElementById('confirmPwd').value
      if (!newPwd || newPwd.length < 4) { showMsg('modalMsg','Mat khau phai co it nhat 4 ky tu!','error'); return }
      if (newPwd !== confirmPwd) { showMsg('modalMsg','Mat khau xac nhan khong khop!','error'); return }
      confirmBtn.disabled = true
      confirmBtn.textContent = 'Dang luu...'
      const saved = await window.authBridge.changePassword(newPwd)
      confirmBtn.disabled = false
      if (!saved) { confirmBtn.textContent = 'Luu mat khau'; showMsg('modalMsg','Loi luu mat khau!','error'); return }
      currentStep = 3
      hideMsg('modalMsg')
      step2El.style.display = 'none'
      step3El.style.display = ''
      dot2.className = 'step-dot done'
      dot3.className = 'step-dot active'
      confirmBtn.style.display = 'none'
      cancelBtn.textContent = 'Dong'
    }
  })

  document.getElementById('masterPwd').addEventListener('keydown', e => { if (e.key === 'Enter') confirmBtn.click() })
  document.getElementById('newPwd').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('confirmPwd').focus() })
  document.getElementById('confirmPwd').addEventListener('keydown', e => { if (e.key === 'Enter') confirmBtn.click() })

  setTimeout(() => pwdInput.focus(), 200)
</script>
</body>
</html>
